<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Grid - Reservas</title>
    <link rel="stylesheet" crossorigin href="/src/style.css" />
  </head>
  <body class="min-h-screen bg-gray-950 text-white font-sans">
    <main class="mx-auto max-w-5xl px-4 py-6">
      <!-- Cabecera -->
      <header class="text-center mb-6">
        <h1 class="text-4xl font-bold tracking-tight text-yellow-400">CINEMA GRID</h1>
        <p class="text-gray-400 text-sm mt-1">Sistema de Reservas - Haz clic en un asiento para reservar</p>
      </header>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Columna izquierda: Mapa de asientos -->
        <div class="lg:col-span-2 bg-gray-900 rounded-2xl border border-gray-800 p-4 shadow-xl">
          <h2 class="text-lg font-semibold text-gray-200 mb-3 flex items-center gap-2">
            <span>Pantalla</span>
            <span class="flex-1 h-1 bg-gradient-to-r from-yellow-500 to-transparent rounded"></span>
          </h2>

          <!-- Pantalla -->
          <div class="text-center mb-6">
            <div class="bg-gradient-to-r from-yellow-600 via-yellow-400 to-yellow-600 h-3 rounded-t-full mx-auto max-w-md shadow-lg shadow-yellow-500/30"></div>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-widest">Pantalla</p>
          </div>

          <!-- Mapa de asientos -->
          <div id="mapa-asientos" class="flex flex-col items-center gap-1.5"></div>

          <!-- Leyenda -->
          <div class="flex justify-center gap-6 mt-5 text-xs text-gray-400">
            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded bg-green-600 border border-green-400"></div>
              <span>Disponible</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded bg-red-600 border border-red-400"></div>
              <span>Ocupado</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded bg-yellow-500 border border-yellow-300 ring-2 ring-yellow-300"></div>
              <span>Seleccionado</span>
            </div>
          </div>

          <!-- Botones de accion -->
          <div class="flex justify-center gap-3 mt-4">
            <button id="btn-contiguos" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition cursor-pointer">Buscar 2 contiguos</button>
            <button id="btn-reiniciar" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium rounded-lg transition cursor-pointer">Reiniciar sala</button>
          </div>
        </div>

        <!-- Columna derecha: Panel de informacion -->
        <div class="flex flex-col gap-4">
          <!-- Info de la reserva -->
          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4 shadow-xl">
            <h3 class="text-md font-semibold text-gray-200 mb-3">Reserva</h3>
            <div id="panel-reserva" class="text-sm text-gray-400">
              <p>Haz clic en un asiento</p>
              <p>para seleccionarlo</p>
            </div>
            <button id="btn-confirmar" class="w-full mt-3 px-4 py-2 bg-yellow-500 hover:bg-yellow-400 text-gray-900 text-sm font-bold rounded-lg transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed" disabled>Confirmar reserva</button>
          </div>

          <!-- Resumen de ocupacion -->
          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4 shadow-xl">
            <h3 class="text-md font-semibold text-gray-200 mb-3">Resumen</h3>
            <div id="panel-resumen" class="text-sm text-gray-400">
              <p>Libres: <span id="total-libres" class="text-green-400 font-bold">80</span></p>
              <p>Ocupados: <span id="total-ocupados" class="text-red-400 font-bold">0</span></p>
              <p>Ocupacion: <span id="porcentaje-ocupacion" class="text-yellow-400 font-bold">0%</span></p>
            </div>
          </div>

          <!-- Historial JSON -->
          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-4 shadow-xl">
            <h3 class="text-md font-semibold text-gray-200 mb-3">Historial de reservas (JSON)</h3>
            <pre id="json-output" class="text-xs text-green-400 bg-gray-950 rounded-lg p-3 overflow-x-auto max-h-40 overflow-y-auto font-mono leading-relaxed">[]</pre>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/ui.ts"></script>
  </body>
</html>
